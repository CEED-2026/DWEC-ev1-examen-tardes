<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuadrados aleatorios</title>
</head>

<body>
  <main>
    <h1>Cuadrados aleatorios</h1>

    <form id="form-cuadrados">
      <label for="cantidad">Número de cuadrados (1-10)</label>
      <input id="cantidad" name="cantidad" type="text" autocomplete="off">
      <button type="submit">Crear</button>
    </form>

    <p id="error" role="alert" style="color:#dc2626;">Introduce un número entero del 1 al 10.</p>

    <section id="contenedor" aria-live="polite">
      <div class="cuadrado" style="width: 48px; height: 48px; background-color: rgb(210, 229, 165);"></div>
      <div class="cuadrado" style="width: 114px; height: 114px; background-color: rgb(201, 60, 236);"></div>
      <div class="cuadrado" style="width: 114px; height: 114px; background-color: rgb(73, 15, 197);"></div>
      <div class="cuadrado" style="width: 103px; height: 103px; background-color: rgb(210, 19, 55);"></div>
      <div class="cuadrado" style="width: 42px; height: 42px; background-color: rgb(101, 147, 229);"></div>
      <div class="cuadrado" style="width: 40px; height: 40px; background-color: rgb(125, 74, 225);"></div>
    </section>
  </main>


</body>

</html>
